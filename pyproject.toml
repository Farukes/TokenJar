[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tokenjar"
version = "1.1.1"
description = "MCP server that saves 70-95% tokens for AI coding assistants without losing functionality"
readme = "README.md"
license = {text = "BSL-1.1"}
requires-python = ">=3.10"
authors = [
    {name = "Ömer Faruk Eskitürk", email = "omereskiturk2@gmail.com"},
]
keywords = ["mcp", "llm", "token", "optimization", "ai", "coding-assistant", "tree-sitter"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "fastmcp>=2.0",
    "tree-sitter>=0.21,<0.22",
    "tree-sitter-languages>=1.10",
    "tomli>=1.1.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]
counting = [
    "tiktoken>=0.7",
]

[project.scripts]
tokenjar = "tokenjar.__main__:main"

[project.urls]
Homepage = "https://github.com/Farukes/TokenJar"
Repository = "https://github.com/Farukes/TokenJar"
Issues = "https://github.com/Farukes/TokenJar/issues"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tokenjar"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore:Language\\(path, name\\) is deprecated:FutureWarning",
]
