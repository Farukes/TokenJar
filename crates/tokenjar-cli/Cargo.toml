[package]
name = "tokenjar"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Zero-cost, zero-latency token optimization engine and intelligent MCP middleware"
documentation = "https://docs.rs/tokenjar"
readme = "../../README.md"
build = "build.rs"

[[bin]]
name = "tokenjar"
path = "src/main.rs"

[dependencies]
tokenjar-core = { version = "1.1.1", path = "../tokenjar-core" }
clap = { version = "4.5", features = ["derive", "cargo"] }
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5.0"
ureq = { version = "2.10", features = ["json"] }
zip = { version = "2.1", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1.0"

[build-dependencies]
winres = "0.1"
